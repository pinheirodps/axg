[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axg"
version = "0.3.0"
description = "Agent Execution Guard: deterministic control plane for safe AI agent execution."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.109.0",
    "pydantic>=2.6.0",
    "uvicorn>=0.27.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    "httpx>=0.26.0",
    # API only: a no-op until a host installs an SDK, so embedding AXG never imposes a backend
    "opentelemetry-api>=1.27.0",
]

[project.optional-dependencies]
# OTLP/HTTP export for the AXG server (enabled by OTEL_EXPORTER_OTLP_ENDPOINT)
otel = [
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "jsonschema>=4.23.0",
    "httpx>=0.26.0",
    "opentelemetry-sdk>=1.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
include = ["axg*"]

[tool.coverage.run]
source = ["axg"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2

[project.scripts]
axg = "axg.cli:main"

