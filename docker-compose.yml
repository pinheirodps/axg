services:
  axg:
    build: .
    image: ghcr.io/pinheirodps/axg:latest
    ports:
      - "8090:8090"
    environment:
      # Secrets come from the environment / .env, never from this file
      - AXG_ADMIN_TOKEN=${AXG_ADMIN_TOKEN:-}
      - AXG_PRIVATE_KEY=${AXG_PRIVATE_KEY:-}
      - AXG_CLIENTS=${AXG_CLIENTS:-}
      - AXG_AUTH_MODE=${AXG_AUTH_MODE:-required}
    volumes:
      - ./plugins:/app/plugins
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Sample Consumer App (Simulating a backend using AXG)
  # This could be a small Node.js app using our new SDK
  # For now, we'll use a simple mock or the user can run their app
