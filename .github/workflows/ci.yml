name: AXG CI

on:
  push:
    branches: [ main, master, feature/** ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

# Third-party actions are pinned by commit SHA (tag in the comment); Dependabot keeps them current.
jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools
        pip install .[test] ./sdks/axg-python-sdk
        pip install pytest pytest-asyncio pytest-cov httpx pip-audit
    - name: Audit dependencies
      # Audit the project's declared dependencies, not the runner's own tooling (pip, setuptools)
      run: pip-audit . --progress-spinner off
    - name: Run Core Tests
      run: |
        python -m pytest --cov=axg --cov=integrations --cov-report=xml --cov-fail-under=98
    - name: Upload Core coverage
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: ./coverage.xml
        flags: core

  test-node-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/axg-node-sdk
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: sdks/axg-node-sdk/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Audit dependencies
      run: npm audit --audit-level=high
    - name: Build and Test
      run: |
        npm run build
        npm test

  test-python-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/axg-python-sdk
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
    - name: Install SDK dependencies
      run: |
        python -m pip install --upgrade pip setuptools
        pip install .
        pip install pytest pytest-asyncio pip-audit
    - name: Audit dependencies
      # Audit the project's declared dependencies, not the runner's own tooling (pip, setuptools)
      run: pip-audit . --progress-spinner off
    - name: Run Python SDK Tests
      run: pytest

  test-agt-dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/agt-dotnet
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '8.0.x'
    - name: Check vulnerable packages
      run: |
        dotnet restore
        dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
        ! grep -q "has the following vulnerable packages" vulnerable.txt
    - name: Test Microsoft AGT backend
      run: dotnet test --nologo
