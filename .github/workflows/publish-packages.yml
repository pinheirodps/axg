name: Publish Packages (PyPI & npm)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-pypi-core:
    name: Publish axg to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/axg
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip setuptools build twine

      - name: Build wheel and sdist
        run: |
          python -m build --sdist --wheel .

      - name: Verify distribution packages
        run: |
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Uses OIDC Trusted Publishing by default when id-token: write is set.
          # If PYPI_API_TOKEN secret exists, it falls back to token auth.
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-pypi-python-sdk:
    name: Publish axg-python-sdk to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi-sdk
      url: https://pypi.org/p/axg-python-sdk
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)
      contents: read
    defaults:
      run:
        working-directory: sdks/axg-python-sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip setuptools build twine

      - name: Build wheel and sdist
        run: |
          python -m build --sdist --wheel .

      - name: Verify distribution packages
        run: |
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/axg-python-sdk/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-npm-node-sdk:
    name: Publish axg-node-sdk to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdks/axg-node-sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'
          cache: npm
          cache-dependency-path: sdks/axg-node-sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: |
          npm run build
          npm test

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
